[package]
name = "openanime-theme"
version = "0.1.0"
description = "OpenAnime Tema Editörü"
authors = ["Dark_Hunter"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable`: Window::add_child / Manager::get_webview için gerekli.
# Tek pencerede iki webview (editör + canlı site) bu API olmadan mümkün değil.
# Sürüm sabit tutuluyor — unstable API'ler minor sürümlerde değişebilir.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# Kanal manifestini eklentiden ÖNCE kendimiz çekiyoruz (bkz. updater.rs ->
# fetch_manifest): 404'ü ağ hatasından ayırt edebilmenin başka yolu yok.
# Zaten tauri-plugin-updater üzerinden bağımlılık ağacında; rustls sürümü
# onunla aynı olsun diye default-features kapalı.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "charset",
    "http2",
    "system-proxy",
] }
# TLS sağlayıcısı: eklentinin kullandığının AYNISI (bkz. updater.rs ->
# ensure_crypto_provider). `rustls-no-provider` sağlayıcıyı süreç düzeyinde
# kurulmuş varsayıyor ve kurulmamışsa istemci hiç oluşturulamıyor.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Yalnızca dosya seçme diyaloğu için. Okuma/yazmayı kendi komutlarımızla
# yapıyoruz ki fs eklentisinin geniş scope yapılandırmasına ihtiyaç olmasın.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
# api.openani.me'ye BURADAN istek atılmıyor: "Vanguard" geçidi
# `Gateway-Token` başlığı olmadan her isteği 401'liyor ve o başlık yalnızca
# openani.me sayfasının kendi (wasm ile imzalanan) `fetch` yaması tarafından
# eklenebiliyor. Hesap isteği bu yüzden önizleme webview'inin içinden
# atılıyor (bkz. `preview_init.js` -> `__OA_ACCOUNT_FETCH__`). Yukarıdaki
# `reqwest` yalnızca güncelleme manifestini çekiyor — o adres GitHub'ın ham
# dosya sunucusu, geçidin arkasında değil.
#
# `sync`: hesap köprüsünün oneshot kanalı. `time`: o kanalın zaman aşımı.
# Tauri zaten tokio üzerinde çalışıyor; doğrudan `use`layabilmek için burada
# da listelenmesi gerekiyor.
tokio = { version = "1", features = ["time", "sync"] }
# Discord Rich Presence. Sürüm sabit: 0.2 serisinde `DiscordIpcClient::new`
# imzası ve `Activity` builder'ı minor sürümler arasında değişti.
discord-rich-presence = "0.2.5"

