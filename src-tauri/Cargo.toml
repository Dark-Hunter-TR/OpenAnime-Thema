[package]
name = "openanime-theme"
version = "0.1.0"
description = "OpenAnime Tema Editörü"
authors = ["Dark_Hunter"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable`: Window::add_child / Manager::get_webview için gerekli.
# Tek pencerede iki webview (editör + canlı site) bu API olmadan mümkün değil.
# Sürüm sabit tutuluyor — unstable API'ler minor sürümlerde değişebilir.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
# Yalnızca dosya seçme diyaloğu için. Okuma/yazmayı kendi komutlarımızla
# yapıyoruz ki fs eklentisinin geniş scope yapılandırmasına ihtiyaç olmasın.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"

