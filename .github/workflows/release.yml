name: '🚀 Publish'

# Tag push edildiğinde otomatik build + yayın, ya da GitHub Actions
# arayüzünden elle tetiklenir. Yalnızca Windows: bkz. README.md -> "Kurulum".
#
# Kanal, tag'in ön-sürüm son ekinden türetilir:
#   v1.0.0          -> stable
#   v1.1.0-beta.1   -> beta
#   v1.2.0-alpha.1  -> alpha
#
# Elle tetiklemede kanal ve baz sürüm seçilir; ön-sürüm sayacı (beta.1,
# beta.2 …) otomatik hesaplanır, elle numara girmek gerekmez.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Yayın kanalı'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - alpha
      version:
        description: 'Sürüm (ör: 0.2.0) — ön-sürüm son ekini YAZMA, kanaldan üretilir'
        required: true
        type: string

concurrency:
  # Aynı tag için tek yayın; devam eden bir yayını yarıda kesme (release/tag
  # silme ve manifest commit'i atomik olmayan işlemler).
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # ────────────────────────────────────────────────────
  # 1) Sürüm + kanalı belirle
  # ────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Sürüm ve kanalı hesapla
        id: meta
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Ön-sürüm sayacı: v<baz>-<kanal>.<N> tag'lerinin en yüksek N'sini
          # bulup N+1 döndürür. Eşleşen tag yoksa 1. Sayaç baz sürüm başına
          # sıfırlanır (v0.2.0-alpha.1 -> v0.2.0-alpha.2; yeni baz 0.2.1 ->
          # alpha.1).
          next_prerelease_n() {
            local base="$1" chan="$2" max=0 ref name n
            while IFS= read -r ref; do
              name="${ref#refs/tags/v}"
              case "$name" in
                "${base}-${chan}."*)
                  n="${name##*.}"
                  case "$n" in ''|*[!0-9]*) ;; *) [ "$n" -gt "$max" ] && max="$n" ;; esac
                  ;;
              esac
            done < <(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${base}-${chan}." \
                       --jq '.[].ref' 2>/dev/null || true)
            echo $((max + 1))
          }

          if [ -z "$INPUT_CHANNEL" ]; then
            # push: tag zaten hazır
            TAG="${GITHUB_REF_NAME}"
          else
            # workflow_dispatch: kanal + baz sürümden tag üret
            VERSION="$INPUT_VERSION"
            case "$INPUT_CHANNEL" in
              stable) TAG="v${VERSION}" ;;
              beta)   TAG="v${VERSION}-beta.$(next_prerelease_n "$VERSION" beta)" ;;
              alpha)  TAG="v${VERSION}-alpha.$(next_prerelease_n "$VERSION" alpha)" ;;
            esac
          fi
          VERSION="${TAG#v}"

          # SemVer doğrulama — yalnızca -alpha.N / -beta.N ön-sürümleri.
          # Serbest bırakılsaydı (ör. -rc.1) hiçbir kanala düşmeyen bir yayın
          # oluşur, kimse güncelleme alamazdı.
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$'; then
            echo "::error::Sürüm biçimi geçersiz: $VERSION (beklenen: 1.2.3 | 1.2.3-alpha.1 | 1.2.3-beta.1)"
            exit 1
          fi

          case "$VERSION" in
            *-beta.*)  CHANNEL=beta ;;
            *-alpha.*) CHANNEL=alpha ;;
            *)         CHANNEL=stable ;;
          esac

          if [ "$CHANNEL" = "stable" ]; then PRE=false; else PRE=true; fi

          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL"   >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE"    >> "$GITHUB_OUTPUT"

          {
            echo "### 🚀 Yayın Bilgisi"
            echo "- **Tag:** \`$TAG\`"
            echo "- **Sürüm:** \`$VERSION\`"
            echo "- **Kanal:** \`$CHANNEL\` (prerelease=$PRE)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────
  # 2) Derle + TASLAK release'e yayınla
  # ────────────────────────────────────────────────────
  build:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      - name: Cache Tauri bundler (NSIS, WiX vb.)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: windows-tauri-bundler-${{ hashFiles('src-tauri/tauri.conf.json') }}
          restore-keys: |
            windows-tauri-bundler-

      - name: Cache Rust bağımlılıkları
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-cargo-

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: windows-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            windows-bun-

      # Sürüm alanları derlemeden ÖNCE yazılıyor: paketin, ikilinin ve updater
      # manifestinin sürümü birbirine uymak zorunda. Depodaki değer ne olursa
      # olsun tag kazanır.
      - name: Sürüm alanlarını tag ile eşitle
        shell: bash
        run: node scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Bağımlılıkları yükle
        run: bun install

      # `createUpdaterArtifacts: true` zaten tauri.conf.json'da — tauri-action
      # imzalama secret'ları verildiğinde latest.json + .sig dosyalarını
      # üretip release'e ekliyor. Secret eksikse manifest hiç üretilmez ve
      # aşağıdaki doğrulama işi BİLEREK patlar.
      - name: Derle & Yayınla (imzalı)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          args: --verbose

  # ────────────────────────────────────────────────────
  # 3) latest.json'un gerçekten üretildiğini doğrula
  # ────────────────────────────────────────────────────
  verify-manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: latest.json release'de var mı?
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "latest.json" \
            --output latest.json \
            --clobber || true
          if [ ! -s latest.json ]; then
            echo "::error::latest.json release'de yok ya da boş — imzalama secret'ları eksik/yanlış olabilir. Yayın durduruldu."
            exit 1
          fi
          echo "latest.json bulundu:"
          cat latest.json

  # ────────────────────────────────────────────────────
  # 4) Taslak release'i canlıya al
  # ────────────────────────────────────────────────────
  publish-release:
    needs: [prepare, build, verify-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Taslağı yayınla
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.prepare.outputs.tag }}" \
            --draft=false \
            --repo "${{ github.repository }}"

  # ────────────────────────────────────────────────────
  # 5) Kanal manifestini main'e commit'le
  #
  # Uygulama bu dosyaları okuyor: updater/latest-<kanal>.json
  # (bkz. src-tauri/src/updater.rs). Yalnızca YAYINLANAN kanalın dosyası
  # güncelleniyor — Stable kanalı seçen kullanıcının alpha/beta sürümü
  # görmemesinin tek ve yeterli sebebi bu.
  # ────────────────────────────────────────────────────
  update-channel-manifest:
    needs: [prepare, verify-manifest, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Yayınlanan latest.json'u indir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p updater
          gh release download "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "latest.json" \
            --output "updater/latest-${{ needs.prepare.outputs.channel }}.json" \
            --clobber

      - name: Değişikliği main'e commit'le
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -f "updater/latest-${CHANNEL}.json" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "updater/latest-${CHANNEL}.json"
            git commit -m "chore(updater): ${CHANNEL} kanal manifestini ${TAG} olarak güncelle [skip ci]" \
              || echo "Değişiklik yok, commit edilmedi."
            git push origin main || { echo "::error::git push başarısız oldu"; exit 1; }
          else
            echo "::error::Kanal manifesti indirilemedi."
            exit 1
          fi
