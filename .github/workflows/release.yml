name: '🚀 Publish'

# Tag push edildiğinde otomatik build + yayın, ya da GitHub Actions
# arayüzünden elle tetiklenir. Windows, macOS ve Linux paralel derleniyor.
#
# Kanal, tag'in ön-sürüm son ekinden türetilir:
#   v1.0.0          -> stable
#   v1.1.0-beta.1   -> beta
#   v1.2.0-alpha.1  -> alpha
#
# Elle tetiklemede kanal ve baz sürüm seçilir; ön-sürüm sayacı (beta.1,
# beta.2 …) otomatik hesaplanır, elle numara girmek gerekmez.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Yayın kanalı'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - alpha
      version:
        description: 'Sürüm (ör: 0.2.0) — ön-sürüm son ekini YAZMA, kanaldan üretilir'
        required: true
        type: string

concurrency:
  # Aynı tag için tek yayın; devam eden bir yayını yarıda kesme (release/tag
  # silme ve manifest commit'i atomik olmayan işlemler).
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # ────────────────────────────────────────────────────
  # 1) Sürüm + kanalı belirle
  # ────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Sürüm ve kanalı hesapla
        id: meta
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Ön-sürüm sayacı: v<baz>-<kanal>.<N> tag'lerinin en yüksek N'sini
          # bulup N+1 döndürür. Eşleşen tag yoksa 1. Sayaç baz sürüm başına
          # sıfırlanır (v0.2.0-alpha.1 -> v0.2.0-alpha.2; yeni baz 0.2.1 ->
          # alpha.1).
          next_prerelease_n() {
            local base="$1" chan="$2" max=0 ref name n
            while IFS= read -r ref; do
              name="${ref#refs/tags/v}"
              case "$name" in
                "${base}-${chan}."*)
                  n="${name##*.}"
                  case "$n" in ''|*[!0-9]*) ;; *) [ "$n" -gt "$max" ] && max="$n" ;; esac
                  ;;
              esac
            done < <(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${base}-${chan}." \
                       --jq '.[].ref' 2>/dev/null || true)
            echo $((max + 1))
          }

          if [ -z "$INPUT_CHANNEL" ]; then
            # push: tag zaten hazır
            TAG="${GITHUB_REF_NAME}"
          else
            # workflow_dispatch: kanal + baz sürümden tag üret
            VERSION="$INPUT_VERSION"
            case "$INPUT_CHANNEL" in
              stable) TAG="v${VERSION}" ;;
              beta)   TAG="v${VERSION}-beta.$(next_prerelease_n "$VERSION" beta)" ;;
              alpha)  TAG="v${VERSION}-alpha.$(next_prerelease_n "$VERSION" alpha)" ;;
            esac
          fi
          VERSION="${TAG#v}"

          # SemVer doğrulama — yalnızca -alpha.N / -beta.N ön-sürümleri.
          # Serbest bırakılsaydı (ör. -rc.1) hiçbir kanala düşmeyen bir yayın
          # oluşur, kimse güncelleme alamazdı.
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$'; then
            echo "::error::Sürüm biçimi geçersiz: $VERSION (beklenen: 1.2.3 | 1.2.3-alpha.1 | 1.2.3-beta.1)"
            exit 1
          fi

          case "$VERSION" in
            *-beta.*)  CHANNEL=beta ;;
            *-alpha.*) CHANNEL=alpha ;;
            *)         CHANNEL=stable ;;
          esac

          if [ "$CHANNEL" = "stable" ]; then PRE=false; else PRE=true; fi

          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL"   >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE"    >> "$GITHUB_OUTPUT"

          {
            echo "### 🚀 Yayın Bilgisi"
            echo "- **Tag:** \`$TAG\`"
            echo "- **Sürüm:** \`$VERSION\`"
            echo "- **Kanal:** \`$CHANNEL\` (prerelease=$PRE)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────
  # 2) Taslak release'i ÖNCEDEN aç
  #
  # Üç platform paralel derlendiği için bu adım şart: `tauri-action` release
  # yoksa kendisi oluşturuyor ve aynı anda başlayan üç iş aynı tag'i yaratmaya
  # çalışınca biri 422 ile düşüyor. Release'i burada tek seferde açıp aşağıya
  # yalnızca `releaseId` geçiyoruz.
  # ────────────────────────────────────────────────────
  create-release:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.mk.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Taslak release'i oluştur (varsa yeniden kullan)
        id: mk
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # Taslak release'ler `releases/tags/<tag>` ile BULUNAMIYOR (o uç nokta
          # yalnızca yayınlanmışlara bakıyor); bu yüzden liste üzerinden arıyoruz.
          find_id() {
            gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1
          }

          ID="$(find_id)"
          if [ -z "$ID" ]; then
            PRE_FLAG=""
            [ "$PRERELEASE" = "true" ] && PRE_FLAG="--prerelease"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --draft $PRE_FLAG \
              --target "$GITHUB_SHA" \
              --notes "Otomatik yayın — varlıklar yükleniyor…"
            ID="$(find_id)"
          fi

          if [ -z "$ID" ]; then
            echo "::error::Taslak release oluşturulamadı."
            exit 1
          fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"
          echo "Taslak release id: $ID"

  # ────────────────────────────────────────────────────
  # 3) Derle + TASLAK release'e yükle (3 platform paralel)
  # ────────────────────────────────────────────────────
  build:
    needs: [prepare, create-release]
    permissions:
      contents: write
    strategy:
      # Bir platform patlarsa diğerlerinin sonucunu da görmek istiyoruz;
      # eksik platformu aşağıdaki manifest işi zaten yakalıyor.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows-x64
            args: ''
          # Tek `universal` derleme hem Apple Silicon hem Intel'i kapsıyor.
          # İki ayrı mimari işi çalıştırmak, ikisinin de AYNI adla
          # (`OpenAnime Theme.app.tar.gz`) release'e yüklenmesi ve birbirini
          # ezmesi demekti.
          - platform: macos-latest
            label: macOS-universal
            args: '--target universal-apple-darwin'
          - platform: ubuntu-latest
            label: Linux-x64
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # WebKitGTK, Tauri'nin Linux'taki webview motoru — `libwebkit2gtk-4.1`.
      # `libxdo` global kısayollar, `patchelf` AppImage paketlemesi için.
      - name: Linux sistem bağımlılıkları
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf \
            file \
            wget

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # `universal-apple-darwin` bir "fat binary" — Tauri iki mimariyi ayrı
          # ayrı derleyip birleştiriyor, dolayısıyla İKİ hedef de kurulu olmalı.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      - name: Cache Tauri bundler (NSIS, WiX vb.)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: windows-tauri-bundler-${{ hashFiles('src-tauri/tauri.conf.json', 'src-tauri/tauri.windows.conf.json') }}
          restore-keys: |
            windows-tauri-bundler-

      - name: Cache Rust bağımlılıkları
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.label }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.label }}-cargo-

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: ${{ matrix.label }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ matrix.label }}-bun-

      # Sürüm alanları derlemeden ÖNCE yazılıyor: paketin, ikilinin ve updater
      # manifestinin sürümü birbirine uymak zorunda. Depodaki değer ne olursa
      # olsun tag kazanır.
      - name: Sürüm alanlarını tag ile eşitle
        shell: bash
        run: node scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Bağımlılıkları yükle
        run: bun install

      # `createUpdaterArtifacts: true` zaten tauri.conf.json'da — tauri-action
      # imzalama secret'ları verildiğinde .sig dosyalarını üretip release'e
      # ekliyor. Secret eksikse imza hiç üretilmez ve aşağıdaki manifest işi
      # BİLEREK patlar.
      - name: Derle & Yükle (imzalı)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }} --verbose

  # ────────────────────────────────────────────────────
  # 4) Çok platformlu updater manifestini kur ve doğrula
  #
  # tauri-action her işte kendi latest.json'unu yükleyip diğerlerini eziyor;
  # bu yüzden manifesti release varlıklarından yeniden kuruyoruz
  # (bkz. scripts/build-updater-manifest.sh).
  # ────────────────────────────────────────────────────
  updater-manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Manifesti üret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/build-updater-manifest.sh \
            "${{ needs.prepare.outputs.tag }}" \
            "${{ needs.prepare.outputs.version }}" \
            latest.json

      # Üç platformun da manifeste girdiğini doğruluyoruz. Eksik bir anahtar,
      # o platformdaki kullanıcının hiç güncelleme almaması demek — sessizce
      # geçilecek bir durum değil.
      - name: Bütün platformlar var mı?
        run: |
          missing=0
          for key in windows-x86_64 darwin-aarch64 darwin-x86_64 linux-x86_64; do
            if ! jq -e --arg k "$key" '.platforms[$k].url' latest.json >/dev/null; then
              echo "::error::Manifestte $key eksik"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Manifesti release'e yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" latest.json \
            --repo "${{ github.repository }}" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: updater-manifest
          path: latest.json

  # ────────────────────────────────────────────────────
  # 5) Taslak release'i canlıya al
  # ────────────────────────────────────────────────────
  publish-release:
    needs: [prepare, build, updater-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Taslağı yayınla
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.prepare.outputs.tag }}" \
            --draft=false \
            --repo "${{ github.repository }}"

  # ────────────────────────────────────────────────────
  # 6) Kanal manifestini main'e commit'le
  #
  # Uygulama bu dosyaları okuyor: updater/latest-<kanal>.json
  # (bkz. src-tauri/src/updater.rs). Yalnızca YAYINLANAN kanalın dosyası
  # güncelleniyor — Stable kanalı seçen kullanıcının alpha/beta sürümü
  # görmemesinin tek ve yeterli sebebi bu.
  # ────────────────────────────────────────────────────
  update-channel-manifest:
    needs: [prepare, updater-manifest, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Birleştirilmiş manifesti indir
        uses: actions/download-artifact@v4
        with:
          name: updater-manifest
          path: manifest-artifact

      - name: Kanal dosyasına yerleştir
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          mkdir -p updater
          cp manifest-artifact/latest.json "updater/latest-${CHANNEL}.json"
          rm -rf manifest-artifact

      - name: Değişikliği main'e commit'le
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -f "updater/latest-${CHANNEL}.json" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "updater/latest-${CHANNEL}.json"
            git commit -m "chore(updater): ${CHANNEL} kanal manifestini ${TAG} olarak güncelle [skip ci]" \
              || echo "Değişiklik yok, commit edilmedi."
            git push origin main || { echo "::error::git push başarısız oldu"; exit 1; }
          else
            echo "::error::Kanal manifesti hazırlanamadı."
            exit 1
          fi
